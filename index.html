<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h2>Sign Up Form</h2>
    <form id="registForm">
        <p>
            <label>Title</label>
            <label><input type="radio" name="title" value="Mr" checked> Mr</label>
            <label><input type="radio" name="title" value="Mrs"> Mrs</label>
            <label><input type="radio" name="title" value="Miss"> Miss</label>
        </p>
        <p>
            <label>First name</label>
            <input type="text" id="firstName">
        </p>
        <p>
            <label>Last name</label>
            <input type="text" id="lastName">
        </p>
        <p>
            <label>Email</label>
            <input type="email" id="email" placeholder="example@mail.com">
        </p>
        <p>
            <label>Phone number</label>
            <input type="tel" id="phone" inputmode="numeric" oninput="onlyNumbers(this)" placeholder="Ex. 0812345678">
        </p>
        <p>
            <label>Password</label>
            <input type="password" id="password">
        </p>
        <p>
            <label>Confirm your password</label>
            <input type="password" id="confirmPassword">
        </p>
        <p>
            <label>Country</label>
            <select id="country">
                <option>Canada</option>
                <option>France</option>
                <option>Germany</option>
                <option>Italy</option>
                <option>Japan</option>
                <option>Russia</option>
                <option>United Kingdom</option>
                <option>United States</option>
            </select>
        </p>
        <p>
            <label>
                <input type="checkbox" id="terms">
                I agree to the <a href="#">terms and conditions</a>
            </label>
        </p>
        
        <p>
            <button type="button" onclick="saveFile()">
                Sign up
            </button>
        </p>
        
        <div style="font-size: 14px; color: #333; margin-top: 10px;">
            <b>ชื่อ:</b> นายศิวัช โพธิมากูล <br>
            <b>รหัสนักศึกษา:</b> 6704053612244
        </div>

    </form>

    <script src="script.js">
    </script>
</body>
</html>
